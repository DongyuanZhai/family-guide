<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="生活顾问">
  <title>生活顾问</title>
  <style>
    :root {
      --bg: #faf6ef; --card: #fffdf8; --text: #2d2a26; --muted: #6b655c;
      --border: #e8e1d4; --accent: #0969da; --me: #e8efe6; --font: 19px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1a17; --card: #24211d; --text: #ece6da; --muted: #a39b8e; --border: #3a352e; --accent: #58a6ff; --me: #2d3a2a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      font-size: var(--font); line-height: 1.7; display: flex; flex-direction: column;
    }
    header {
      padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--card);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-top: calc(14px + env(safe-area-inset-top));
    }
    header h1 { margin: 0; font-size: 1.15em; font-weight: 600; }
    header .ver { font-size: 0.75em; color: var(--muted); }
    header button { font-size: 0.85em; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); padding: 4px 10px; }
    main { flex: 1; overflow-y: auto; padding: 16px 16px 8px; -webkit-overflow-scrolling: touch; }
    .msg { max-width: 92%; margin: 0 0 14px; padding: 12px 16px; border-radius: 14px; word-break: break-word; }
    .msg.me { background: var(--me); margin-left: auto; border-bottom-right-radius: 4px; }
    .msg.ai { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.ai p { margin: 0 0 0.6em; } .msg.ai p:last-child { margin-bottom: 0; }
    .msg.ai h1, .msg.ai h2, .msg.ai h3 { font-size: 1.05em; margin: 0.8em 0 0.3em; }
    .msg.ai ul, .msg.ai ol { padding-left: 1.3em; margin: 0.3em 0 0.6em; }
    .msg.ai li { margin-bottom: 0.4em; }
    .msg.ai a { color: var(--accent); word-break: break-all; }
    .msg.ai.error { color: #b42318; }
    .sources { font-size: 0.8em; color: var(--muted); margin: -6px 0 16px 4px; }
    .sources summary { cursor: pointer; }
    .sources a { color: var(--muted); }
    .thinking { color: var(--muted); font-size: 0.9em; }
    .thinking::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
    .chips button { font-size: 0.9em; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; color: var(--text); }
    .welcome { color: var(--muted); font-size: 0.95em; margin: 0 0 14px; }
    form {
      display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--card);
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    textarea {
      flex: 1; font: inherit; resize: none; border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; background: var(--bg); color: var(--text); max-height: 140px;
    }
    form button {
      font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0;
      border-radius: 12px; padding: 0 20px; min-width: 76px;
    }
    form button:disabled { opacity: 0.5; }
    .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
    .gate div { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; max-width: 360px; width: 100%; }
    .gate h2 { margin: 0 0 8px; font-size: 1.2em; }
    .gate p { color: var(--muted); margin: 0 0 16px; font-size: 0.95em; }
    .gate input { width: 100%; font: inherit; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); margin-bottom: 12px; }
    .gate button { width: 100%; font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="gate" class="gate hidden">
    <div>
      <h2>请输入口令</h2>
      <p>这是家里人专用的，口令问一下孩子就好。输一次以后不用再输。</p>
      <input id="codeInput" type="text" inputmode="text" autocomplete="off" placeholder="口令">
      <button id="codeBtn">进入</button>
    </div>
  </div>

  <header>
    <div>
      <h1>生活顾问</h1>
      <div class="ver" id="ver">根据《高性价比人生指南》回答</div>
    </div>
    <button id="clearBtn">重新开始</button>
  </header>

  <main id="chat">
    <p class="welcome">有什么事拿不准，直接问。我会先去书里查，再告诉您书上怎么说、出自哪一条。可以点下面的例子试试。</p>
    <div class="chips" id="chips">
      <button>有人推销保健品，买不买</button>
      <button>老人的钱怎么放才安全</button>
      <button>体检套餐哪些不用做</button>
      <button>家里的常备药哪些不能一起吃</button>
      <button>遗嘱怎么立才有效</button>
      <button>手机丢了第一步做什么</button>
    </div>
  </main>

  <form id="form">
    <textarea id="input" rows="1" placeholder="输入您的问题" required></textarea>
    <button id="send" type="submit">发送</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const gate = document.getElementById("gate");
    const history = [];
    let code = "";
    try { code = localStorage.getItem("code") || ""; } catch {}

    if (!code) gate.classList.remove("hidden");
    document.getElementById("codeBtn").onclick = () => {
      const v = document.getElementById("codeInput").value.trim();
      if (!v) return;
      code = v;
      try { localStorage.setItem("code", v); } catch {}
      gate.classList.add("hidden");
    };
    document.getElementById("clearBtn").onclick = () => location.reload();
    document.getElementById("chips").addEventListener("click", (e) => {
      if (e.target.tagName === "BUTTON") { input.value = e.target.textContent; form.requestSubmit(); }
    });

    input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });

    // 很小的 markdown 渲染：标题、列表、加粗、链接。先转义再处理，防止注入。
    function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
    function inline(s) {
      return esc(s)
        .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
        .replace(/(https?:\/\/[^\s<）)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }
    function render(md) {
      const out = []; let list = null;
      const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
      for (const raw of md.split("\n")) {
        const line = raw.trimEnd();
        let m;
        if (!line.trim()) { close(); continue; }
        if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); }
        else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
        else if ((m = line.match(/^\s*\d+[.、)]\s*(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
        else { close(); out.push(`<p>${inline(line)}</p>`); }
      }
      close();
      return out.join("");
    }

    function add(cls, html) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.innerHTML = html;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      if (!code) { gate.classList.remove("hidden"); return; }
      document.getElementById("chips")?.remove();
      document.querySelector(".welcome")?.remove();
      input.value = ""; input.style.height = "auto";
      send.disabled = true;
      add("me", esc(q));
      const ai = add("ai", '<span class="thinking">正在翻书</span>');

      let text = "";
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, history: history.slice(-6), code }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          if (res.status === 401) { try { localStorage.removeItem("code"); } catch {} code = ""; gate.classList.remove("hidden"); }
          throw new Error(err.error || `出错了（${res.status}）`);
        }
        const ver = res.headers.get("X-Book-Version");
        if (ver) document.getElementById("ver").textContent = "书的版本 " + ver;

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n"); buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
              if (delta) { text += delta; ai.innerHTML = render(text); chat.scrollTop = chat.scrollHeight; }
            } catch {}
          }
        }
        if (!text) throw new Error("没有收到回答，请再试一次");
        history.push({ role: "user", content: q }, { role: "assistant", content: text });

        const src = res.headers.get("X-Sources");
        if (src) {
          const list = JSON.parse(decodeURIComponent(src));
          if (list.length) {
            const d = document.createElement("details");
            d.className = "sources";
            d.innerHTML = `<summary>本次翻到的 ${list.length} 条（点开可去原书核对）</summary>` +
              list.map((s) => `<div><a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a> ${esc(s.title)}</div>`).join("");
            chat.appendChild(d);
          }
        }
      } catch (err) {
        ai.className = "msg ai error";
        ai.textContent = err.message;
      } finally {
        send.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    });
  </script>
</body>
</html>
