# 每周一自动去拉最新的书，重新生成 entries.json。有变化就提交，Cloudflare 会自动重新部署。
name: Update book entries

on:
  schedule:
    - cron: "0 20 * * 0"   # UTC 周日 20:00，即北京时间周一早上 4:00
  workflow_dispatch:        # 也可以在 GitHub 的 Actions 页面手动点一下运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-entries.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/entries.json; then
            echo "书没有更新"
          else
            git add public/entries.json
            git commit -m "Update book entries $(date -u +%Y-%m-%d)"
            git push
          fi
